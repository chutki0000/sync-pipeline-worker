name: Stream Sync Pipeline

on:
  schedule:
    - cron: '30 0 * * *'  # Strictly once every 24 hours at 06:00 AM IST (00:30 UTC, right after Classplus daily reset)

  workflow_dispatch:
    inputs:
      course_id:
        description: 'Course ID to sync'
        required: false
        default: '876795'
      course_name:
        description: 'Course Name'
        required: false
        default: 'CSE STREAM : Sem-I + Sem-II COMBO'
      token:
        description: 'Classplus JWT Token (leave empty to use secret)'
        required: false
        default: ''
      max_videos:
        description: 'Max videos to process this run'
        required: false
        default: '20'
      max_pdfs:
        description: 'Max PDFs to process this run'
        required: false
        default: '20'

  repository_dispatch:
    types: [matrix-sync]

jobs:
  sync_worker:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Worker
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg & Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl
          curl -sL "https://github.com/nilaoda/N_m3u8DL-RE/releases/download/v0.6.0-beta/N_m3u8DL-RE_v0.6.0-beta_linux-x64_20260629.tar.gz" | sudo tar -xz -C /usr/local/bin/
          chmod +x /usr/local/bin/N_m3u8DL-RE || true

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -r tools/requirements.txt

      - name: Fetch Current Master Index from Server
        run: |
          mkdir -p data
          curl -s -f -m 20 "${{ secrets.SERVER_SYNC_URL }}/api/v1/master_index" -o data/master_index.json || echo "{}" > data/master_index.json
          echo "✅ Existing master_index loaded via Cloudflare Masked API"

      - name: Execute Sync Engine
        env:
          SYNC_API_ID: ${{ secrets.TG_API_ID }}
          SYNC_API_HASH: ${{ secrets.TG_API_HASH }}
          SYNC_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHANNEL_ID: ${{ secrets.TG_CHANNEL_ID }}
          CLASSPLUS_TOKEN: ${{ github.event.inputs.token || github.event.client_payload.token || secrets.CLASSPLUS_TOKEN }}
        run: |
          CID="${{ github.event.inputs.course_id || github.event.client_payload.course_id || '876795' }}"
          CNAME="${{ github.event.inputs.course_name || github.event.client_payload.course_name || 'CSE STREAM : Sem-I + Sem-II COMBO' }}"
          MAX_V="${{ github.event.inputs.max_videos || github.event.client_payload.max_videos || '20' }}"
          MAX_P="${{ github.event.inputs.max_pdfs || github.event.client_payload.max_pdfs || '20' }}"

          echo "=============================================="
          echo "Starting Sync for Course: $CNAME ($CID)"
          echo "Limits: Max Videos=$MAX_V, Max PDFs=$MAX_P"
          echo "=============================================="

          # Generate Text Manifest Blueprint
          python3 tools/sync_engine.py --course-id "$CID" --course-name "$CNAME" --export-txt || true

          # Turbo Sync Execution (N_m3u8DL-RE 16-thread multi-stream)
          python3 tools/sync_engine.py --course-id "$CID" --course-name "$CNAME" --max-videos "$MAX_V" --max-pdfs "$MAX_P"

      - name: Deploy Updated Master Index to Server
        if: always()
        run: |
          if [ -f data/master_index.json ]; then
            curl -s -f -X POST "${{ secrets.SERVER_SYNC_URL }}/api/v1/master_index/update" \
              -H "Content-Type: application/json" \
              -H "X-Sync-Key: ${{ secrets.SYNC_API_KEY }}" \
              --data-binary @data/master_index.json
            echo "✅ master_index.json updated on server via Cloudflare Masked API"
          fi

      - name: Notify Admin via Telegram
        if: always()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_OWNER_ID: ${{ secrets.BOT_OWNER_ID }}
        run: |
          CID="${{ github.event.inputs.course_id || github.event.client_payload.course_id || '876795' }}"
          CNAME="${{ github.event.inputs.course_name || github.event.client_payload.course_name || 'CSE STREAM : Sem-I + Sem-II COMBO' }}"
          MSG=$(printf "⚡ *Stream Sync Pipeline Completed!*\n\n📦 *Course:* \`%s\` (\`%s\`)\n✅ Master index refreshed on Cloud Server.\n📱 Students can now view latest content." "$CNAME" "$CID")

          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TG_OWNER_ID}" \
            --data-urlencode "text=${MSG}" \
            -d parse_mode="Markdown" > /dev/null || true
          echo "✅ Telegram notification dispatched"
